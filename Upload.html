<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSMR - Upload Project</title>
    <link rel="stylesheet" href="Css.css">
    <style>
        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2d2836;
            color: #bfa7de;
            border: 2px dashed #ff66aa;
            padding: 25px 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }

        .custom-file-upload:hover {
            background-color: #342e3e;
            color: #ffffff;
            border-color: #ff85bc;
            box-shadow: 0 0 12px rgba(255, 102, 170, 0.3);
        }

        .upload-icon {
            font-size: 1.5rem;
            color: #ff66aa;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .file-name-display {
            display: block;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #ff66aa;
            font-style: italic;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <nav>
        <strong>OSMR</strong> | 
        <a href="osmr!.html">Main</a> | 
        <a href="index.html">Home</a> |  
        <a href="About.html">About</a> | 
        <a href="Upload.html">Upload Project</a> |
        <a href="Tips.html">Tips & Guides</a>
    </nav>

    <main class="main-container">
        <h1>Submit Your Music Project</h1>
        <p>Fill out the form below to get production and mixing feedback from other students.</p>

        <form id="uploadForm">
            <p>
                <label>Track Title:</label><br>
                <input type="text" name="track_title" placeholder="e.g. Moonlight Bass" required>
            </p>

            <p>
                <label>Genre / Style:</label><br>
                <input type="text" name="genre" placeholder="e.g. Lo-Fi Hip Hop, Techno, Synthwave" required>
            </p>

            <p>
                <label>BPM (Beats Per Minute):</label><br>
                <input type="number" name="bpm" placeholder="120" min="1" max="999">
            </p>

            <p>
                <label>Primary DAW Used:</label><br>
                <select name="daw_type" required>
                    <option value="">-- Select Your DAW --</option>
                    <option value="ableton">Ableton Live</option>
                    <option value="fl_studio">FL Studio</option>
                    <option value="logic_pro">Logic Pro</option>
                    <option value="pro_tools">Pro Tools</option>
                    <option value="cubase">Cubase</option>
                    <option value="reaper">Reaper</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <p>
                <label>Upload Audio Preview or Project File (.mp3, .wav, .zip, .m4a):</label><br>
                
                <label for="project_file" class="custom-file-upload">
                    <span class="upload-icon">⇪</span>
                    <span>Click to choose or drag your project file here</span>
                </label>
                <input type="file" id="project_file" name="project_file" accept=".mp3,.wav,.zip,.m4a" required>
                
                <span id="file-chosen" class="file-name-display">No file chosen</span>
            </p>

            <p>
                <label>What do you need help with? (Optional):</label><br>
                <textarea name="feedback_note" rows="4" placeholder="e.g. Need help fixing the low end, vocal mixing, or mastering..."></textarea>
            </p>

            <button type="submit">Upload Now</button>
        </form>
    </main>

    <!-- CLEANED UP: Combined into one clean, error-free script block -->
    <script>
        const fileInput = document.getElementById('project_file');
        const fileChosen = document.getElementById('file-chosen');

        // Handles displaying the selected file name visually
        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileChosen.textContent = "Selected: " + this.files[0].name;
            } else {
                fileChosen.textContent = "No file chosen";
            }
        });

        // Client-side database interceptor
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Block standard server actions

            const title = document.querySelector('[name="track_title"]').value;
            const genre = document.querySelector('[name="genre"]').value;
            const bpm = document.querySelector('[name="bpm"]').value || 'N/A';
            const daw = document.querySelector('[name="daw_type"]').value;
            const note = document.querySelector('[name="feedback_note"]').value || 'No notes provided.';
            
            if (!title || !genre || !fileInput.files.length) {
                alert("Please fill out all required fields and select a file!");
                return;
            }

            // Create a track object matching your old schema rows
            const newTrack = {
                id: Date.now(),
                title: title,
                genre: genre,
                bpm: bpm,
                daw: daw,
                note: note,
                filename: fileInput.files[0].name, 
                comments: []
            };

            // Save array cleanly into localStorage database simulator
            let tracks = JSON.parse(localStorage.getItem('uploadedTracks')) || [];
            tracks.unshift(newTrack);
            localStorage.setItem('uploadedTracks', JSON.stringify(tracks));

            alert(`Upload Successful! "${title}" has been successfully broadcasted onto the live home stream.`);
            window.location.href = 'index.html'; // Redirect to home layout page structure
        });
    </script>

</body>
</html>
